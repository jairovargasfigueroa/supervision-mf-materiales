<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Materiales · prueba aislada</title>
    <!-- Página solo para desarrollar el microfrontend sin el shell -->
    <script type="application/json" id="mfe-manifest">
      { "mf-materiales": "./remoteEntry.json" }
    </script>
    <script>
      window.addEventListener(
        'mfe-loader-available',
        (e) => e.detail.loadRemoteModule('mf-materiales', './Bootstrap'),
        { once: true },
      );
    </script>
    <script src="https://unpkg.com/@softarc/native-federation-orchestrator@4.8.0/quickstart.mjs"></script>
  </head>
  <body>
    <mf-materiales></mf-materiales>
  </body>
</html>
